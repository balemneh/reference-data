<div class="cbp-modal-overlay cbp-fade-in" (click)="cancel()">
  <div class="cbp-modal cbp-slide-up" (click)="$event.stopPropagation()" role="dialog" aria-modal="true" [attr.aria-labelledby]="'justification-modal-title'">
    <!-- TEST COMMENT -->
    <div class="cbp-modal-header">
      <h2 class="cbp-modal-title" id="justification-modal-title">{{ title }}</h2>
      <button class="cbp-modal-close" (click)="cancel()" aria-label="Close modal">
        <svg class="cbp-modal-close-icon" aria-hidden="true">
          <use xlink:href="/assets/uswds/img/sprite.svg#close"></use>
        </svg>
      </button>
    </div>
    <div class="cbp-modal-content">
      <p class="margin-bottom-3">{{ description }}</p>
      <div class="cbp-form-group" [class.cbp-form-group--error]="formErrors.justification">
        <label class="cbp-label" for="business-justification">
          Business Justification <span class="text-secondary-dark">*</span>
        </label>
        <textarea
          id="business-justification"
          name="business-justification"
          class="cbp-textarea"
          [class.cbp-input--error]="formErrors.justification"
          [(ngModel)]="justification"
          rows="4"
          placeholder="Please provide a detailed business justification for this change request..."
          required
        ></textarea>
        <div class="cbp-field-hint">
          Minimum 10 characters required. This justification will be reviewed by administrators.
        </div>
        <span *ngIf="formErrors.justification" class="cbp-error-message">
          {{ formErrors.justification }}
        </span>
      </div>
      <div *ngIf="formErrors.general" class="cbp-alert cbp-alert--error margin-top-2">
        <div class="cbp-alert__body">
          <p class="cbp-alert__text">{{ formErrors.general }}</p>
        </div>
      </div>
    </div>
    <div class="cbp-modal-footer">
      <button class="cbp-button cbp-button--secondary" (click)="cancel()">
        Cancel
      </button>
      <button
        class="cbp-button cbp-button--primary"
        (click)="submit()"
        [disabled]="!justification?.trim() || justification.trim().length < 10"
      >
        Submit Change Request
      </button>
    </div>
  </div>
</div>

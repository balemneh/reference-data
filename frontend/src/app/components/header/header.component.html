<header class="usa-header usa-header--basic">
  <div class="usa-nav-container">
    <div class="usa-navbar">
      <div class="usa-logo" id="basic-logo">
        <em class="usa-logo__text">Reference Data</em>
      </div>
    </div>
    <nav class="usa-nav" aria-label="Primary navigation">
      <ul class="usa-nav__primary usa-accordion">
        <li class="usa-nav__primary-item" *ngIf="!isLoggedIn">
          <button class="usa-button" (click)="login()">Log in</button>
        </li>
        <li class="usa-nav__primary-item" *ngIf="isLoggedIn">
          <span class="usa-nav__link"><span>Welcome, {{ userProfile?.name }}</span></span>
        </li>
        <li class="usa-nav__primary-item" *ngIf="isLoggedIn">
          <button class="usa-button usa-button--unstyled" (click)="logout()">Log out</button>
        </li>
      </ul>
    </nav>
  </div>
</header>

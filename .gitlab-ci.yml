include:
  - remote: https://gitlab.cbp.dhs.gov/artifacts/templates/raw/master/sast-gitlab-ci.yml

stages:
  - setup
  - test-ui
  - build-ui
  - build-api
  - sast

variables:
  MAVEN_REPO_PATH: "$CI_PROJECT_DIR/.m2/repository"

setup:
  image: docker.cbp.dhs.gov/cloud/ubi/openjdk-build:21-ubi9
  stage: .pre
  script:
    - |
      mkdir -p ${MAVEN_REPO_PATH}
      echo "<settings><localRepository>${MAVEN_REPO_PATH}</localRepository></settings>" > $CI_PROJECT_DIR/.m2/settings.xml
      ls -ltR $CI_PROJECT_DIR/.m2
  artifacts:
    paths:
      - .m2/

test-ui:
  stage: test-ui
  image: docker.cbp.dhs.gov/cloud/ubi/nodejs-build:20
  except:
    - tags
  before_script:
    # installs deps in frontend/
    - npm --prefix frontend ci || npm --prefix frontend install
  script:
    - chmod +x frontend/scripts/before-test.sh
    - ./frontend/scripts/before-test.sh
    # Ensure folder exists (some junit reporters won't create it)
    - mkdir -p frontend/test-results
    # Runs ng test with coverage; karma writes test-results/karma.xml
    - npm --prefix frontend test
    # Optional: show where coverage landed
    - ls -la frontend/test-results || true
    - ls -la frontend/coverage || true
  artifacts:
    when: always
    reports:
      junit:
        - frontend/test-results/karma.xml
      coverage_report:
        coverage_format: cobertura
        path: frontend/coverage/**/cobertura-coverage.xml
    paths:
      - frontend/test-results/
      - frontend/coverage/
    expire_in: 5 day
  coverage: '/Lines\s*:\s*(\d+\.\d+)/'

build-ui:
  stage: build-ui
  image: docker.cbp.dhs.gov/cloud/ubi/nodejs-build:22
  except:
    - tags
  before_script:
    - npm --prefix frontend ci || npm --prefix frontend install
  script:
    - npm --prefix frontend run build
  artifacts:
    paths:
      - "frontend/dist"
    expire_in: 5 day

build-api:
  stage: build-api
  image: docker.cbp.dhs.gov/cloud/ubi/openjdk-build:21-ubi9
  except:
    - tags
  script:
    - mvn -B -s $CI_PROJECT_DIR/.m2/settings.xml clean verify
  artifacts:
    when: always
    reports:
      junit:
        - '**/target/surefire-reports/TEST-*.xml'
      coverage_report:
        coverage_format: jacoco
        path: "**/target/site/jacoco/jacoco.xml"
    paths:
      - '**/target/surefire-reports/'
      - '**/target/site/jacoco/'
    name: "$CI_PROJECT_NAME-$CI_COMMIT_TAG"
    expire_in: 1 day
  coverage: '/Line coverage of (\d+\.\d+)/'

